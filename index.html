<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1412">
<title>FINN — Financial Investment Agent (prototype)</title>
<style>
  :root { --bg:#0f1412; --panel:#17201c; --line:#26322d; --ink:#e9efeb; --muted:#8a9a92; --accent:#7fd3a6; --warn:#f0b86b; --bad:#ec8a7a; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing:antialiased; }
  body { padding-bottom: calc(68px + env(safe-area-inset-bottom)); }
  header.top { position:sticky; top:0; z-index:5; background:rgba(15,20,18,.92); backdrop-filter: blur(8px); padding:14px 18px 10px; border-bottom:1px solid var(--line); }
  .brand { font-weight:700; letter-spacing:.08em; font-size:14px; }
  .brand span { color:var(--accent); }
  .sub { color:var(--muted); font-size:12px; }
  main { max-width: 560px; margin: 0 auto; padding: 14px 16px 24px; }
  nav.bottom { position:fixed; bottom:0; left:0; right:0; display:flex; justify-content:space-around; background:var(--panel); border-top:1px solid var(--line); padding:8px 6px calc(8px + env(safe-area-inset-bottom)); z-index:6; }
  nav.bottom button { flex:1; background:none; border:0; color:var(--muted); font:inherit; font-size:13px; padding:8px 0; border-radius:10px; }
  nav.bottom button.on { color:var(--accent); background:rgba(127,211,166,.08); }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:22px 0 10px; font-weight:600; }
  h3 { font-size:15px; margin:0 0 6px; }
  section { margin: 18px 0; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px 14px 12px; margin:10px 0; }
  .card header { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:6px; }
  .card h3 { margin:4px 0 6px; font-size:16px; line-height:1.35; }
  .card p { margin:0 0 8px; color:#cdd8d2; }
  .tag { font-size:11px; padding:3px 8px; border-radius:99px; background:rgba(127,211,166,.12); color:var(--accent); letter-spacing:.02em; }
  .muted { color:var(--muted); } .small { font-size:12px; }
  .alert { background:var(--panel); border-left:3px solid var(--warn); border-radius:10px; padding:10px 12px; margin:8px 0; }
  .alert.px { border-color: var(--bad); }
  .alert b { margin-right:6px; }
  .seg { display:flex; gap:6px; background:var(--panel); padding:4px; border-radius:12px; border:1px solid var(--line); }
  .seg button { flex:1; background:none; border:0; color:var(--muted); padding:8px 0; border-radius:9px; font:inherit; font-size:13px; }
  .seg button.on { background:var(--bg); color:var(--ink); box-shadow:inset 0 0 0 1px var(--line); }
  table.fin { width:100%; border-collapse:collapse; font-size:13px; margin:8px 0 4px; }
  table.fin th, table.fin td { text-align:left; padding:6px 4px; border-bottom:1px solid var(--line); vertical-align:top; }
  table.fin th { color:var(--muted); font-weight:500; font-size:12px; }
  .bio, .callout { background:#122019; border:1px solid #1f3a2d; border-radius:12px; padding:10px 12px; margin-top:8px; font-size:14px; }
  .bio ul { margin:6px 0; padding-left:18px; } .bio li { margin:3px 0; }
  .callout { border-color:#2d4f3e; }
  .label { font-size:12px; color:var(--muted); margin-top:6px; }
  details.routine { margin-top:14px; background:var(--panel); border:1px dashed var(--line); border-radius:12px; padding:10px 12px; color:var(--muted); }
  details.routine summary { cursor:pointer; font-size:13px; }
  .row { padding:6px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .search, .search-row input, .slider input { width:100%; }
  input, button { font:inherit; }
  .search, .search-row input { background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:12px; padding:11px 12px; }
  .search-row { display:flex; gap:8px; }
  .search-row input { flex:1; }
  .search-row button { background:var(--accent); color:#0c1511; border:0; border-radius:12px; padding:0 16px; font-weight:600; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { background:var(--panel); border:1px solid var(--line); border-radius:99px; padding:5px 10px; font-size:12.5px; }
  .px { display:flex; align-items:center; gap:12px; margin:8px 0; font-size:20px; }
  .spark { color:var(--accent); }
  .bull, .bear { border-radius:12px; padding:10px 12px; margin:6px 0; font-size:14px; }
  .bull { background:#14271d; } .bear { background:#2a1c19; }
  .slider { display:block; margin:14px 0; font-size:14px; }
  .slider input { margin-top:8px; accent-color: var(--accent); }
  .chks { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .chk { font-size:13px; display:flex; gap:6px; align-items:center; }
  code { background:var(--panel); padding:1px 5px; border-radius:6px; font-size:12px; }
  p.note { font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<header class="top">
  <div class="brand">FIN<span>N</span> <span class="sub" style="font-weight:400;letter-spacing:0">· investor intelligence prototype · demo data</span></div>
</header>
<main id="view"><p class="muted">Loading…</p></main>
<nav class="bottom">
  <button data-tab="push" class="on">Push</button>
  <button data-tab="pull">Pull</button>
  <button data-tab="network">Network</button>
  <button data-tab="settings">Alerts</button>
</nav>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
